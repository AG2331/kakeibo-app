name: Kakeibo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: "YES"
    CODE_SIGN_STYLE: Automatic

targets:
  Kakeibo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kakeibo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 家計簿
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - sdk: libsqlite3.tbd

  KakeiboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kakeibo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kakeibo.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Kakeibo:
    build:
      targets:
        Kakeibo: all
        KakeiboTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KakeiboTests
    archive:
      config: Release
